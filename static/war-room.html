<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2308101f'/%3E%3Cpath d='M16 16h32v8H24v8h20v8H24v8h24v8H16z' fill='%2355d8ff'/%3E%3C/svg%3E">
  <title>PLACHEM Agent War Room</title>
  <style>
    :root { color-scheme: dark; --bg:#08101f; --panel:#111c30; --line:#283957; --text:#eef5ff; --muted:#98aac5; --cyan:#55d8ff; --green:#5ee6a8; --amber:#ffc76b; }
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.5 Inter,system-ui,sans-serif; color:var(--text); background:radial-gradient(circle at top,#14233d,var(--bg) 48%); }
    header { position:sticky; top:0; z-index:3; display:flex; justify-content:space-between; gap:16px; align-items:center; padding:16px 24px; background:rgba(8,16,31,.92); border-bottom:1px solid var(--line); backdrop-filter:blur(12px); }
    h1,h2,h3,p { margin-top:0; } h1 { font-size:20px; margin-bottom:3px; } h2 { font-size:15px; }
    .badge { padding:5px 9px; border:1px solid var(--green); border-radius:999px; color:var(--green); font-weight:700; }
    .shell { display:grid; grid-template-columns:260px minmax(0,1fr) 310px; gap:14px; padding:14px; max-width:1600px; margin:auto; }
    .panel { background:rgba(17,28,48,.94); border:1px solid var(--line); border-radius:14px; padding:15px; box-shadow:0 14px 35px rgba(0,0,0,.18); }
    .stack { display:grid; gap:10px; }
    .project,.agent,.event,.placeholder { border:1px solid var(--line); border-radius:10px; padding:11px; background:#0d1729; }
    .project.active { border-color:var(--cyan); }
    .muted { color:var(--muted); } .accent { color:var(--cyan); }
    .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .stat { padding:10px; border-radius:9px; background:#0b1526; border:1px solid var(--line); text-align:center; }
    .stat strong { display:block; font-size:18px; color:var(--cyan); }
    .toolbar { display:flex; gap:8px; justify-content:space-between; align-items:center; margin-bottom:12px; }
    button,select { border:1px solid var(--line); background:#0c1728; color:var(--text); border-radius:8px; padding:8px 10px; }
    button[disabled] { opacity:.42; cursor:not-allowed; }
    .event { display:grid; grid-template-columns:90px 1fr; gap:10px; }
    .event-type { color:var(--cyan); font-weight:700; }
    .gap { color:var(--amber); }
    .agent-head { display:flex; justify-content:space-between; gap:8px; }
    .status { color:var(--green); }
    .empty { padding:28px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:10px; }
    .error { color:#ff8f9b; }
    @media(max-width:1000px){ .shell{grid-template-columns:220px 1fr}.right{grid-column:1/-1}.right .stack{grid-template-columns:repeat(2,1fr)} }
    @media(max-width:700px){ header{padding:13px}.shell{grid-template-columns:1fr;padding:10px}.right{grid-column:auto}.right .stack{grid-template-columns:1fr}.event{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <header>
    <div><h1>PLACHEM Agent War Room</h1><div class="muted">멀티에이전트 통합 작전실 · 1단계</div></div>
    <span class="badge">READ ONLY</span>
  </header>
  <main class="shell">
    <aside class="panel">
      <div class="toolbar"><h2>프로젝트</h2><button disabled>새 작전실</button></div>
      <div id="projects" class="stack"><div class="empty">불러오는 중…</div></div>
    </aside>
    <section class="panel">
      <div class="toolbar">
        <div><h2 id="project-title">공동 타임라인</h2><div id="baseline" class="muted"></div></div>
        <div><select disabled><option>최근 100건</option></select> <button disabled>지시 작성</button></div>
      </div>
      <div id="stats" class="stat-grid"></div>
      <h2 style="margin-top:16px">타임라인</h2>
      <div id="timeline" class="stack"><div class="empty">불러오는 중…</div></div>
      <h2 style="margin-top:16px">후속 화면</h2>
      <div class="stack">
        <div class="placeholder"><strong>실행 승인·담당자 지정</strong><div class="muted">후속 단계에서 활성화 · 승인 없는 실행 차단</div></div>
        <div class="placeholder"><strong>실행 결과·증거·QA</strong><div class="muted">후속 단계에서 활성화 · QA PASS와 증거 필수</div></div>
        <div class="placeholder"><strong>중지·재개·감사 이력</strong><div class="muted">후속 단계에서 활성화 · 재개 시 새 승인 필수</div></div>
      </div>
    </section>
    <aside class="panel right">
      <h2>참여 에이전트</h2><div id="agents" class="stack"><div class="empty">불러오는 중…</div></div>
      <h2 style="margin-top:16px">기획 기준선</h2><div id="gaps" class="stack"></div>
    </aside>
  </main>
  <script>
    const projectId = "plachem-agent-war-room";
    const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    async function get(url){ const response=await fetch(url,{cache:"no-store"}); if(!response.ok) throw new Error(`${response.status} ${response.statusText}`); return response.json(); }
    function fail(id,error){ document.getElementById(id).innerHTML=`<div class="empty error">조회 실패: ${esc(error.message)}</div>`; }
    async function load(){
      try { const data=await get('/api/war-room/projects'); document.getElementById('projects').innerHTML=data.items.map(p=>`<div class="project active"><strong>${esc(p.name)}</strong><div class="muted">${esc(p.status)} · 참여자 ${p.participant_count}</div></div>`).join('')||'<div class="empty">프로젝트 없음</div>'; } catch(e){ fail('projects',e); }
      try { const data=await get(`/api/war-room/projects/${projectId}/timeline`); document.getElementById('timeline').innerHTML=data.items.map(m=>`<article class="event"><div class="event-type">${esc(m.message_type)}</div><div><strong>${esc(m.author_id)}</strong><p>${esc(m.body)}</p><small class="muted">${new Date(m.created_at*1000).toLocaleString()}</small></div></article>`).join('')||'<div class="empty">기록 없음</div>'; } catch(e){ fail('timeline',e); }
      try { const [ops,participants]=await Promise.all([get(`/api/war-room/projects/${projectId}/operations`),get(`/api/war-room/projects/${projectId}/participants`)]); const roles=Object.fromEntries(participants.items.map(p=>[p.principal_id,p.role])); document.getElementById('agents').innerHTML=ops.agents.map(a=>`<div class="agent"><div class="agent-head"><strong>${esc(a.agent_id)}</strong><span class="status">${esc(a.state)}</span></div><div class="muted">${esc(roles[a.agent_id]||'participant')} · 세션 ${a.session_count}</div><small>${a.latest?esc(a.latest.status):'최근 세션 없음'}</small></div>`).join(''); } catch(e){ fail('agents',e); }
      try { const b=await get(`/api/war-room/projects/${projectId}/manyfast-baseline`); document.getElementById('baseline').textContent=`ManyFast ${b.version}`; document.getElementById('stats').innerHTML=[['요구사항',b.counts.requirements],['기능',b.counts.features],['상세 기능',b.counts.specs]].map(x=>`<div class="stat"><strong>${x[1]}</strong>${x[0]}</div>`).join(''); document.getElementById('gaps').innerHTML=b.known_gaps.map(x=>`<div class="placeholder gap">보완 설계: ${esc(x)}</div>`).join(''); } catch(e){ fail('gaps',e); }
    }
    load(); setInterval(load,15000);
  </script>
</body>
</html>
